<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="theme-color" content="#0D0D12"/>
  <title>TransLive</title>
  <link rel="manifest" href="/static/manifest.json"/>
  <link rel="apple-touch-icon" href="/static/icon.png"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    :root {
      --bg:       #0D0D12;
      --card:     #16161E;
      --elevated: #1E1E28;
      --accent:   #7C6FFF;
      --accent2:  #A78BFA;
      --text:     #F0F0F8;
      --subtext:  #8888A0;
      --success:  #22C55E;
      --error:    #EF4444;
      --warning:  #F59E0B;
    }

    html, body {
      height: 100%; width: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
    }

    .app {
      display: flex; flex-direction: column;
      height: 100dvh; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    }

    /* ── Header ── */
    .header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 20px 8px;
    }
    .logo { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
    .logo span { color: var(--accent); }
    .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--subtext); transition: background 0.3s;
    }
    .status-dot.active { background: var(--success); box-shadow: 0 0 8px var(--success); }

    /* ── Language selector ── */
    .lang-row {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 20px;
    }
    .lang-select {
      flex: 1; background: var(--elevated); color: var(--text);
      border: 1px solid #2A2A38; border-radius: 10px;
      padding: 10px 12px; font-size: 14px; appearance: none;
      -webkit-appearance: none; outline: none;
    }
    .swap-btn {
      background: var(--elevated); border: 1px solid #2A2A38;
      border-radius: 10px; padding: 10px 14px;
      color: var(--accent); font-size: 18px; cursor: pointer;
    }

    /* ── Translation display ── */
    .translation-area {
      flex: 1; display: flex; flex-direction: column;
      padding: 12px 20px; gap: 12px; overflow: hidden;
    }

    .text-card {
      flex: 1; background: var(--card); border-radius: 16px;
      padding: 16px; display: flex; flex-direction: column;
      overflow: hidden; position: relative;
    }
    .text-card-label {
      font-size: 11px; font-weight: 600; letter-spacing: 0.5px;
      text-transform: uppercase; color: var(--subtext); margin-bottom: 10px;
    }
    .text-content {
      flex: 1; overflow-y: auto; font-size: 18px; line-height: 1.5;
      color: var(--text);
    }
    .text-content.original { font-size: 15px; color: var(--subtext); }
    .text-content .phrase { margin-bottom: 8px; }
    .text-content .phrase.interim { opacity: 0.6; font-style: italic; }
    .text-content .phrase.final { opacity: 1; }

    .clear-btn {
      position: absolute; top: 12px; right: 12px;
      background: var(--elevated); border: none; border-radius: 6px;
      color: var(--subtext); font-size: 11px; padding: 4px 8px;
      cursor: pointer;
    }

    /* ── Record button ── */
    .record-area {
      padding: 16px 20px calc(16px + env(safe-area-inset-bottom));
      display: flex; flex-direction: column; align-items: center; gap: 12px;
    }

    .record-btn {
      width: 80px; height: 80px; border-radius: 50%;
      background: var(--accent); border: none;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: transform 0.15s, background 0.15s;
      box-shadow: 0 4px 24px rgba(124, 111, 255, 0.4);
      -webkit-user-select: none; user-select: none;
    }
    .record-btn:active, .record-btn.recording {
      transform: scale(0.93);
      background: #EF4444;
      box-shadow: 0 4px 24px rgba(239, 68, 68, 0.5);
    }
    .record-btn svg { width: 32px; height: 32px; fill: white; }

    .record-hint {
      font-size: 13px; color: var(--subtext); text-align: center;
    }

    /* ── Audio level bar ── */
    .level-bar-wrap {
      width: 100%; height: 4px; background: var(--elevated);
      border-radius: 2px; overflow: hidden;
    }
    .level-bar {
      height: 100%; width: 0%; background: var(--accent);
      border-radius: 2px; transition: width 0.1s;
    }

    /* ── Toast ── */
    .toast {
      position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
      background: var(--card); color: var(--text); padding: 10px 20px;
      border-radius: 20px; font-size: 13px; opacity: 0;
      transition: opacity 0.3s; pointer-events: none; white-space: nowrap;
      border: 1px solid #2A2A38;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
<div class="app">

  <!-- Header -->
  <div class="header">
    <div class="logo">Trans<span>Live</span></div>
    <div class="status-dot" id="statusDot"></div>
  </div>

  <!-- Language row -->
  <div class="lang-row">
    <select class="lang-select" id="sourceLang">
      <option value="auto">Auto Detect</option>
    </select>
    <button class="swap-btn" id="swapBtn">⇄</button>
    <select class="lang-select" id="targetLang"></select>
  </div>

  <!-- Translation display -->
  <div class="translation-area">
    <div class="text-card">
      <div class="text-card-label">Original</div>
      <button class="clear-btn" onclick="clearAll()">Clear</button>
      <div class="text-content original" id="originalText"></div>
    </div>
    <div class="text-card">
      <div class="text-card-label">Translated</div>
      <div class="text-content" id="translatedText"></div>
    </div>
  </div>

  <!-- Record button -->
  <div class="record-area">
    <div class="level-bar-wrap">
      <div class="level-bar" id="levelBar"></div>
    </div>
    <button class="record-btn" id="recordBtn">
      <svg viewBox="0 0 24 24"><path d="M12 1a4 4 0 0 1 4 4v6a4 4 0 0 1-8 0V5a4 4 0 0 1 4-4zm-1 17.93V21H9v2h6v-2h-2v-2.07A8 8 0 0 0 20 11h-2a6 6 0 0 1-12 0H4a8 8 0 0 0 7 7.93z"/></svg>
    </button>
    <div class="record-hint" id="recordHint">Hold to translate</div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
const LANGUAGES = {
  "Auto Detect": "auto", "English": "en", "Chinese (Simplified)": "zh-CN",
  "Chinese (Traditional)": "zh-TW", "Spanish": "es", "French": "fr",
  "German": "de", "Japanese": "ja", "Korean": "ko", "Portuguese": "pt",
  "Russian": "ru", "Arabic": "ar", "Italian": "it", "Dutch": "nl",
  "Polish": "pl", "Turkish": "tr", "Vietnamese": "vi", "Thai": "th",
  "Indonesian": "id", "Hindi": "hi", "Swedish": "sv", "Norwegian": "no",
  "Danish": "da", "Finnish": "fi"
};

// Populate language dropdowns
const srcSel = document.getElementById("sourceLang");
const tgtSel = document.getElementById("targetLang");

Object.entries(LANGUAGES).forEach(([name, code]) => {
  srcSel.add(new Option(name, code));
  if (code !== "auto") tgtSel.add(new Option(name, code));
});
tgtSel.value = "en";

// Swap languages
document.getElementById("swapBtn").onclick = () => {
  const s = srcSel.value, t = tgtSel.value;
  if (s !== "auto") { srcSel.value = t; tgtSel.value = s; }
};

// State
let ws = null, mediaRecorder = null, audioCtx = null, analyser = null;
let recording = false, levelTimer = null;

const recordBtn  = document.getElementById("recordBtn");
const recordHint = document.getElementById("recordHint");
const statusDot  = document.getElementById("statusDot");
const levelBar   = document.getElementById("levelBar");
const origEl     = document.getElementById("originalText");
const transEl    = document.getElementById("translatedText");

function showToast(msg, ms = 2500) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), ms);
}

function clearAll() {
  origEl.innerHTML = ""; transEl.innerHTML = "";
}

function addPhrase(el, text, isFinal) {
  // Remove last interim if exists
  const last = el.querySelector(".phrase.interim");
  if (last) last.remove();
  const div = document.createElement("div");
  div.className = "phrase " + (isFinal ? "final" : "interim");
  div.textContent = text;
  el.appendChild(div);
  el.scrollTop = el.scrollHeight;
}

// WebSocket connection
function connectWS(source, target) {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${location.host}/ws/transcribe`);
  ws.binaryType = "arraybuffer";

  ws.onopen = () => {
    ws.send(JSON.stringify({ source, target }));
    statusDot.classList.add("active");
  };

  ws.onmessage = (e) => {
    const data = JSON.parse(e.data);
    if (data.error) { showToast("Error: " + data.error); return; }
    addPhrase(origEl,  data.original,   data.is_final);
    addPhrase(transEl, data.translated, data.is_final);
  };

  ws.onclose = () => statusDot.classList.remove("active");
}

// Audio recording
async function startRecording() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: {
      sampleRate: 16000, channelCount: 1, echoCancellation: true, noiseSuppression: true
    }});

    // Level meter
    audioCtx  = new AudioContext({ sampleRate: 16000 });
    analyser  = audioCtx.createAnalyser();
    const src = audioCtx.createMediaStreamSource(stream);
    src.connect(analyser);
    analyser.fftSize = 256;
    const buf = new Uint8Array(analyser.frequencyBinCount);
    levelTimer = setInterval(() => {
      analyser.getByteFrequencyData(buf);
      const avg = buf.reduce((a, b) => a + b, 0) / buf.length;
      levelBar.style.width = Math.min(100, avg * 2) + "%";
    }, 80);

    // Connect WS
    connectWS(srcSel.value, tgtSel.value);

    // Wait for WS open
    await new Promise(r => { ws.onopen = () => { ws.send(JSON.stringify({ source: srcSel.value, target: tgtSel.value })); r(); statusDot.classList.add("active"); }; });

    // Stream audio as PCM via ScriptProcessor
    const processor = audioCtx.createScriptProcessor(4096, 1, 1);
    src.connect(processor);
    processor.connect(audioCtx.destination);
    processor.onaudioprocess = (e) => {
      if (!recording || ws?.readyState !== WebSocket.OPEN) return;
      const f32 = e.inputBuffer.getChannelData(0);
      const i16 = new Int16Array(f32.length);
      for (let i = 0; i < f32.length; i++) i16[i] = Math.max(-32768, Math.min(32767, f32[i] * 32768));
      ws.send(i16.buffer);
    };

    recording = true;
    recordBtn.classList.add("recording");
    recordHint.textContent = "Listening…";

  } catch (err) {
    showToast("Microphone access denied");
  }
}

function stopRecording() {
  recording = false;
  recordBtn.classList.remove("recording");
  recordHint.textContent = "Hold to translate";
  levelBar.style.width = "0%";
  clearInterval(levelTimer);
  if (audioCtx) { audioCtx.close(); audioCtx = null; }
  if (ws) { ws.close(); ws = null; }
  statusDot.classList.remove("active");
}

// Touch / mouse events
recordBtn.addEventListener("touchstart", e => { e.preventDefault(); startRecording(); }, { passive: false });
recordBtn.addEventListener("touchend",   e => { e.preventDefault(); stopRecording(); },  { passive: false });
recordBtn.addEventListener("mousedown",  () => startRecording());
recordBtn.addEventListener("mouseup",    () => stopRecording());
recordBtn.addEventListener("mouseleave", () => { if (recording) stopRecording(); });
</script>
</body>
</html>
